services:
  - type: web
    name: podcast-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # piper is the only engine that fits the free 512MB instance under real
      # load (~230MB steady / ~370MB peak, measured). kitten and kokoro peak
      # past 512MB and get OOM-killed — use them only on paid instances.
      - key: TTS_ENGINE
        value: piper
      - key: AUDIO_TTL_HOURS
        value: "24"
